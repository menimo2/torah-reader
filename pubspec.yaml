name: torah_reader
description: אפליקציית בעל קורא — תרגול קריאה בתורה עם ניקוד, טעמים ומצב מסמיך.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  xml: ^6.5.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wlc/
    - assets/fonts/EzraSIL-OFL.txt
    - assets/data/parashot.json
    - assets/data/NOTICE
    - assets/signs/jerusalem/
  fonts:
    - family: EzraSIL
      fonts:
        - asset: assets/fonts/SILEOT.ttf
