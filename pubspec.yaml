name: torah_reader
description: אפליקציית בעל קורא — תרגול קריאה בתורה עם ניקוד, טעמים ומצב מסמיך.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  xml: ^6.5.0
  sqflite: ^2.4.1
  sqflite_common_ffi: ^2.3.4+4
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  file_picker: ^8.3.7
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/wlc/
    - assets/fonts/EzraSIL-OFL.txt
    - assets/fonts/SBLHebrew-OFL.txt
    - assets/data/parashot.json
    - assets/data/NOTICE
    - assets/signs/jerusalem/default.png
    - assets/signs/jerusalem/etnachta.png
    - assets/signs/jerusalem/zaqef_gadol.png
    - assets/signs/jerusalem/revia.png
    - assets/signs/jerusalem/zarqa.gif
    - assets/signs/jerusalem/geresh.gif
    - assets/signs/jerusalem/azla.gif
    - assets/signs/jerusalem/segolta.png
    - assets/signs/jerusalem/tevir.gif
    - assets/signs/jerusalem/gershayim.png
  fonts:
    - family: SBLHebrew
      fonts:
        - asset: assets/fonts/SBL_Hbrw.ttf
    - family: EzraSIL
      fonts:
        - asset: assets/fonts/SILEOT.ttf
